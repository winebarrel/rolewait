coverage:
  status:
    project:
      default:
        target: 90%
        threshold: 1%
    patch:
      default:
        target: 90%
        threshold: 0%

ignore:
  # kong wiring with nothing to assert that --help does not already prove.
  - "cmd/rolewait/main.go"
  # Reads what the Go toolchain stamped into the binary, which a test binary
  # never carries: ReadBuildInfo always succeeds there and no vcs.revision is
  # recorded, so neither fallback is reachable from a test.
  - "cmd/rolewait/version.go"
